# tailisman gate config. Parsed once at startup; any error stops the gate from starting. Keep it mode 0600.

listen = "127.0.0.1:8471"                     # loopback only; a tunnel's ingress, or Caddy's forward_auth and reverse_proxy, point here
session_secret_file = "gate-secret"           # 32 bytes from `tailisman keygen`; relative paths resolve against this file's directory
password_file = "gate-password"               # one scrypt hash line, written by `tailisman passwd`; missing means the password path is off
guest_file = "guest-passwords"                # optional, this is the default; guest records written by `tailisman passwd --add NAME --sites ...`
session_days = 30                             # 1 to 400
issuer = "https://laptop.example-tailnet.ts.net:8443"   # optional; without it only the password path exists

[rate_limit]                                  # optional; these are the defaults
per_ip = 5                                    # failed passwords per client IP per window
global = 30                                   # failed passwords across all IPs per window
window_seconds = 900

[[sites]]
host = "tools.example.com"
cookie_domain = "example.com"                 # optional; one sign-in then covers every host under example.com. Without it the cookie is host-only.
tailisman_key = "tsk1.<43 base64url characters>"   # optional; from `tailisman key --aud https://tools.example.com` on the issuer
open = ["/healthz", "/api/*", "POST /report"] # optional; requests that pass without a session, so the app behind must guard them itself

[[sites]]
host = "notes.example.com"
cookie_domain = "example.com"

[[sites]]
host = "files.example.com"
cookie_domain = "example.com"
upstream = "http://127.0.0.1:9100"            # optional; the gate proxies this site to the app itself (for a Cloudflare Tunnel, no Caddy)
